name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --force

      - name: Lint
        run: |
          echo "::group::Running lint"
          yarn lint || { echo "::error::Linting failed!"; exit 1; }
          echo "::endgroup::"

      - name: Type Check (Flow)
        run: |
          echo "::group::Running Flow type check"
          # Use dom-node renderer for CI
          yarn flow dom-node || { echo "::error::Flow type errors detected!"; exit 1; }
          echo "::endgroup::"

      - name: Tests
        run: |
          echo "::group::Running tests"
          yarn test --ci || { echo "::error::Tests failed!"; exit 1; }
          echo "::endgroup::"

      - name: Build
        run: |
          echo "::group::Building project"
          yarn build || { echo "::error::Build failed!"; exit 1; }
          echo "::endgroup::"
