name: CI – React Build & Test

on:
  push:
    branches:
      - develop         # or whichever branch you want
      - 'feature/*'     # optionally wildcard for feature branches
  pull_request:
    branches:
      - develop
      - 'feature/*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'    # or your project's node version

      - name: Install dependencies
        run: npm install       # or yarn install

      - name: Lint & Format Check
        run: npm run lint      # if you have lint script

      - name: Run tests
        run: npm test          # adjust if you use different test command

      - name: Build
        run: npm run build     # build step
