name: CI – React Build Without Tests

on:
  push:
    branches:
      - develop
      - 'feature/*'
  pull_request:
    branches:
      - develop
      - 'feature/*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: yarn install

      - name: Skip tests
        run: echo "Skipping all test cases in CI"

      # If you want to run tests but ignore failures, use this instead:
      # - name: Run tests (ignore failures)
      #   run: yarn test --ci || true

      - name: Build project
        run: yarn build
